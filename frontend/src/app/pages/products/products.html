<h1>Products</h1>

@if (error()) {
  <p class="error">{{ error() }}</p>
}

<table class="table">
  <thead>
  <tr>
    <th>Name</th>
    <th>Price</th>
  </tr>
  </thead>
  <tbody>
    @for (product of products(); track product.id) {
      <tr>
        <td>{{ product.name }}</td>
        <td>{{ product.price | number: '1.2-2' }}</td>
      </tr>
    } @empty {
      <tr>
        <td colspan="2">No products yet.</td>
      </tr>
    }
  </tbody>
</table>
